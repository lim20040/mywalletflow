<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./index_files/css2" rel="stylesheet">
<script src="./index_files/xlsx.full.min.js.다운로드"></script>
<script src="./index_files/xlsx-populate.min.js.다운로드"></script>
<script src="./index_files/firebase-app-compat.js.다운로드"></script>
<script src="./index_files/firebase-auth-compat.js.다운로드"></script>
<script src="./index_files/firebase-firestore-compat.js.다운로드"></script>
<style>
  :root{
    --paper:#F3F7F0;
    --rule:#BFDAC7;
    --rule-strong:#9FC6AC;
    --card:#FEFDFA;
    --ink:#1F2E28;
    --ink-soft:#5A6E64;
    --income:#2E6B4E;
    --income-bg:#E4F1E8;
    --expense:#B23A32;
    --expense-bg:#FBEAE8;
    --savings:#2E5A93;
    --savings-bg:#E5ECF6;
    --gold:#A9812E;
    --gold-soft:#EFE3C2;
    --shadow: 0 2px 10px rgba(31,46,40,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 30px,
        var(--rule) 31px,
        transparent 32px
      ),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    padding: 20px 14px 60px;
  }
  .wrap{
    max-width: 720px;
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  .header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .header-row h1{
    font-weight:900;
    font-size: 26px;
    margin:0 0 2px;
    letter-spacing: -0.5px;
  }
  .header-row p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .header-btns{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .ghost-btn{
    flex-shrink:0;
    border:1.5px solid var(--rule-strong);
    background:var(--card);
    color:var(--ink);
    font-size:12.5px;
    font-weight:700;
    padding:8px 13px;
    border-radius:9px;
    cursor:pointer;
    box-shadow: var(--shadow);
    white-space:nowrap;
  }
  .ghost-btn:hover{ background:var(--gold-soft); }

  /* ---------- Overall status (총정리) ---------- */
  .overall{
    background: var(--ink);
    color: var(--paper);
    border-radius:16px;
    padding: 20px 20px 18px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .overall .ov-label{
    font-size:12px;
    color: #B9CBC1;
    font-weight:500;
    margin-bottom:4px;
  }
  .overall .ov-main{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom: 16px;
  }
  .overall .ov-main .num{
    font-size:30px;
    font-weight:900;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .overall .ov-main .cap{
    font-size:12.5px;
    color:#B9CBC1;
  }
  .ov-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    padding-top:14px;
    padding-bottom: 14px;
    border-top: 1px solid rgba(255,255,255,0.15);
  }
  .ov-grid .ov-item .t{
    font-size:11px;
    color:#B9CBC1;
    margin-bottom:4px;
  }
  .ov-grid .ov-item .v{
    font-size:14.5px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
  }
  .ov-grid .ov-item.income .v{ color:#8FD6AC; }
  .ov-grid .ov-item.expense .v{ color:#F0A39C; }
  .ov-grid .ov-item.savings .v{ color:#9AC0F0; }

  .upcoming{
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 14px;
    padding-bottom: 14px;
  }
  .upcoming .t-row, .by-account .t-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .upcoming .t, .by-account .t{
    font-size:11px;
    color:#B9CBC1;
  }
  .manage-link{
    background:none;
    border:none;
    color:#D9C98A;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    padding:0;
  }
  .upcoming-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 6px 0;
    font-size:13px;
  }
  .upcoming-row .u-left{ color:#DDEAE2; }
  .upcoming-row .u-date{ color:#B9CBC1; font-size:11.5px; margin-right:6px; }
  .upcoming-row .u-amt{ font-weight:700; font-variant-numeric: tabular-nums; color:#F0A39C; }

  .by-account{
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 14px;
  }
  .acc-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 7px 0;
    font-size:13.5px;
    border-bottom: 1px dashed rgba(255,255,255,0.12);
  }
  .acc-row:last-child{ border-bottom:none; }
  .acc-row .acc-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:500;
  }
  .acc-row .acc-name::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background:#B9CBC1;
    display:inline-block;
    flex-shrink:0;
  }
  .acc-row .acc-val{
    font-weight:800;
    font-variant-numeric: tabular-nums;
  }
  .acc-row .acc-val.neg{ color:#F0A39C; }

  /* ---------- Month nav ---------- */
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:14px;
  }
  .month-nav button{
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--rule-strong);
    background:var(--card);
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .month-nav button:hover{ background:var(--gold-soft); }
  .month-label{
    font-weight:800;
    font-size:17px;
    min-width:120px;
    text-align:center;
  }

  /* ---------- Account filter tabs ---------- */
  .acc-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom: 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .acc-tabs::-webkit-scrollbar{ height:4px; }
  .acc-tabs::-webkit-scrollbar-thumb{ background:var(--rule-strong); border-radius:4px; }
  .acc-tab{
    flex-shrink:0;
    padding: 7px 14px;
    border-radius:999px;
    border:1.5px solid var(--rule-strong);
    background:var(--card);
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .acc-tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#fff;
  }

  /* ---------- Summary cards ---------- */
  .summary{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:10px;
    margin-bottom: 22px;
  }
  .sum-card{
    background:var(--card);
    border-radius:12px;
    padding:14px 8px;
    text-align:center;
    box-shadow: var(--shadow);
    border-top: 3px solid var(--rule-strong);
  }
  .sum-card.income{ border-top-color: var(--income); }
  .sum-card.expense{ border-top-color: var(--expense); }
  .sum-card.savings{ border-top-color: var(--savings); }
  .sum-card.balance{ border-top-color: var(--gold); }
  .sum-card .label{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:500;
  }
  .sum-card .value{
    font-weight:800;
    font-size:14.5px;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .sum-card.income .value{ color:var(--income); }
  .sum-card.expense .value{ color:var(--expense); }
  .sum-card.savings .value{ color:var(--savings); }
  .sum-card.balance .value{ color:var(--gold); }

  /* ---------- Form card ---------- */
  .form-card{
    background:var(--card);
    border-radius:14px;
    padding:18px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .form-card h2{
    font-size:15px;
    margin:0 0 14px;
    font-weight:800;
    display:flex; align-items:center; gap:6px;
  }
  .form-card h2::before{
    content:"";
    width:6px; height:6px;
    background:var(--gold);
    border-radius:50%;
    display:inline-block;
  }

  .type-toggle{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .type-toggle label{
    flex:1;
    text-align:center;
    padding:9px 0;
    border-radius:8px;
    border:1.5px solid var(--rule-strong);
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    color:var(--ink-soft);
    transition: all .15s;
    user-select:none;
  }
  .type-toggle input{ display:none; }
  .type-toggle label.expense-lbl.active{
    background:var(--expense-bg); color:var(--expense); border-color:var(--expense);
  }
  .type-toggle label.income-lbl.active{
    background:var(--income-bg); color:var(--income); border-color:var(--income);
  }
  .type-toggle label.savings-lbl.active{
    background:var(--savings-bg); color:var(--savings); border-color:var(--savings);
  }
  .type-toggle label.transfer-lbl.active{
    background:var(--gold-soft); color:var(--gold); border-color:var(--gold);
  }

  .field-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field.full{ grid-column: 1 / -1; }
  .field label{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .field input, .field select{
    font-family:'Noto Sans KR', sans-serif;
    padding:9px 10px;
    border-radius:8px;
    border:1.5px solid var(--rule-strong);
    background:#fff;
    font-size:14px;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  .field input:focus, .field select:focus{
    border-color:var(--gold);
  }
  .field .hint{
    font-size:11px;
    color:var(--ink-soft);
  }
  .field .hint button{
    background:none; border:none; padding:0;
    color:var(--gold); font-weight:700; cursor:pointer;
    text-decoration:underline;
    font-size:11px;
  }

  .add-btn{
    width:100%;
    margin-top:6px;
    padding:11px 0;
    border:none;
    border-radius:9px;
    background:var(--ink);
    color:var(--paper);
    font-weight:800;
    font-size:14.5px;
    cursor:pointer;
    letter-spacing: 0.5px;
    transition: opacity .15s;
  }
  .add-btn:hover{ opacity:0.85; }
  .add-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .form-msg{
    font-size:12px;
    color:var(--expense);
    margin-top:6px;
    min-height:14px;
  }

  /* ---------- List ---------- */
  .list-card{
    background:var(--card);
    border-radius:14px;
    padding:18px 18px 8px;
    box-shadow: var(--shadow);
  }
  .list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .list-head h2{
    font-size:15px;
    margin:0;
    font-weight:800;
    display:flex; align-items:center; gap:6px;
  }
  .list-head h2::before{
    content:"";
    width:6px; height:6px;
    background:var(--gold);
    border-radius:50%;
    display:inline-block;
  }
  .list-head .count{
    font-size:12px;
    color:var(--ink-soft);
  }

  table{
    width:100%;
    border-collapse: collapse;
    font-size:13px;
  }
  thead th{
    text-align:left;
    font-weight:500;
    font-size:11px;
    color:var(--ink-soft);
    border-bottom: 2px solid var(--rule-strong);
    padding: 6px 6px;
  }
  thead th.num{ text-align:right; }
  tbody td{
    padding: 10px 6px;
    border-bottom: 1px dashed var(--rule-strong);
    vertical-align: middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: rgba(169,129,46,0.05); }

  .badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
  }
  .badge.income{ color:var(--income); background:var(--income-bg); }
  .badge.expense{ color:var(--expense); background:var(--expense-bg); }
  .badge.savings{ color:var(--savings); background:var(--savings-bg); }
  .badge.transfer{ color:var(--gold); background:var(--gold-soft); }

  .acc-chip{
    display:block;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .auto-tag{
    display:inline-block;
    font-size:9.5px;
    color:var(--gold);
    background:var(--gold-soft);
    border-radius:5px;
    padding:1px 4px;
    margin-left:4px;
    font-weight:700;
    vertical-align:middle;
  }

  .amt{
    text-align:right;
    font-weight:800;
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .amt.income{ color:var(--income); }
  .amt.expense{ color:var(--expense); }
  .amt.savings{ color:var(--savings); }
  .amt.transfer{ color:var(--gold); }

  .memo-cell{
    color:var(--ink-soft);
    font-size:12px;
    max-width: 90px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .date-cell{ white-space:nowrap; color:var(--ink-soft); font-size:12px;}

  .del-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:4px 6px;
    border-radius:6px;
  }
  .del-btn:hover{ background:var(--expense-bg); color:var(--expense); }

  .empty-state{
    text-align:center;
    padding: 34px 10px 26px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-size:15px;
    color:var(--ink);
    margin-bottom:4px;
    font-weight:800;
  }
  .empty-state .small{ font-size:12.5px; }

  .list-footer{
    display:flex;
    justify-content:flex-end;
    padding: 10px 4px 4px;
  }
  .reset-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:11.5px;
    cursor:pointer;
    text-decoration:underline;
    padding:4px;
  }
  .reset-btn:hover{ color:var(--expense); }

  .loading{
    text-align:center;
    padding: 60px 0;
    color:var(--ink-soft);
    font-size:13px;
  }

  /* ---------- Management views shared (accounts / recurring) ---------- */
  .mgmt-add-card{
    background:var(--card);
    border-radius:14px;
    padding:18px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .mgmt-add-card h2{
    font-size:15px;
    margin:0 0 12px;
    font-weight:800;
    display:flex; align-items:center; gap:6px;
  }
  .mgmt-add-card h2::before{
    content:"";
    width:6px; height:6px;
    background:var(--gold);
    border-radius:50%;
    display:inline-block;
  }
  .acc-add-row{
    display:flex;
    gap:8px;
  }
  .acc-add-row input{
    flex:1;
    font-family:'Noto Sans KR', sans-serif;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid var(--rule-strong);
    font-size:14px;
    outline:none;
  }
  .acc-add-row input:focus{ border-color:var(--gold); }
  .acc-add-row button{
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-weight:800;
    font-size:13.5px;
    padding:0 18px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .acc-add-row button:hover{ opacity:0.85; }

  .mgmt-list-card{
    background:var(--card);
    border-radius:14px;
    padding:8px 18px 14px;
    box-shadow: var(--shadow);
  }
  .mgmt-list-card h2{
    font-size:15px;
    margin:14px 0 10px;
    font-weight:800;
    display:flex; align-items:center; gap:6px;
  }
  .mgmt-list-card h2::before{
    content:"";
    width:6px; height:6px;
    background:var(--gold);
    border-radius:50%;
    display:inline-block;
  }
  .mgmt-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 13px 4px;
    border-bottom: 1px dashed var(--rule-strong);
  }
  .mgmt-row:last-child{ border-bottom:none; }
  .mgmt-info{ min-width:0; }
  .mgmt-info .nm{
    font-weight:700;
    font-size:14.5px;
    margin-bottom:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .mgmt-info .bal{
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
    line-height:1.5;
  }
  .mgmt-info .bal.neg{ color:var(--expense); }
  .mgmt-actions{
    display:flex;
    gap:2px;
    flex-shrink:0;
  }
  .icon-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:14.5px;
    padding:6px 7px;
    border-radius:7px;
    color:var(--ink-soft);
  }
  .icon-btn:hover{ background:var(--gold-soft); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--expense-bg); color:var(--expense); }

  .rename-row{
    display:flex;
    gap:8px;
    flex:1;
  }
  .rename-row input{
    flex:1;
    font-family:'Noto Sans KR', sans-serif;
    padding:7px 10px;
    border-radius:7px;
    border:1.5px solid var(--gold);
    font-size:14px;
    outline:none;
  }
  .rename-row button{
    border:none;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    padding:0 10px;
    cursor:pointer;
  }
  .rename-row .save-btn{ background:var(--ink); color:var(--paper); }
  .rename-row .cancel-btn{ background:none; color:var(--ink-soft); }

  .paused-tag{
    font-size:10px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--rule);
    border-radius:5px;
    padding:1px 6px;
  }

  .edit-card{
    background:#fff;
    border:1.5px solid var(--gold);
    border-radius:12px;
    padding:14px;
    margin:8px 0;
  }
  .edit-card .field-row{ margin-bottom:8px; }
  .edit-card .type-toggle{ margin-bottom:10px; }
  .edit-actions{
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  .edit-actions button{
    flex:1;
    border:none;
    border-radius:8px;
    padding:9px 0;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .edit-actions .save-btn{ background:var(--ink); color:var(--paper); }
  .edit-actions .cancel-btn{ background:var(--rule); color:var(--ink); }

  @media (max-width: 480px){
    .summary{ grid-template-columns: repeat(2, 1fr); }
    .ov-grid{ grid-template-columns: repeat(3, 1fr); }
    .field-row{ grid-template-columns: 1fr; }
    .memo-cell{ max-width:60px; }
    .header-row h1{ font-size:22px; }
  }
</style>
</head>
<body>
  <div class="wrap" id="app">
      <div class="header-row">
        <div><h1>나의 가계부</h1><p>2026년 10월 기준</p></div>
        <div class="header-btns">
          <button class="ghost-btn" id="importBtn">📥 가져오기</button>
          <button class="ghost-btn" id="manageRecBtn">🔁 고정비</button>
          <button class="ghost-btn" id="manageAccBtn">⚙ 계좌 관리</button>
          <span class="ghost-btn" style="cursor:default;" title="모든 기기에 자동 동기화 중">☁ 동기화 중</span>
        </div>
      </div>

      <div class="overall">
        <div class="ov-label">지금까지의 총 잔액</div>
        <div class="ov-main"><span class="num">₩0</span><span class="cap">모든 계좌 잔액 합계</span></div>
        <div class="ov-grid">

<script>
(function(){
  'use strict';
  const app = document.getElementById('app');

  /* =====================================================================
     상수
  ===================================================================== */
  const CATS = {
    income: ['급여','부수입','용돈','상여금','기타수입'],
    expense: ['식비','교통','주거/공과금','쇼핑','문화/여가','의료/건강','교육','통신','경조사','기타지출'],
    savings: ['적금','예금','투자','비상금','기타저축']
  };
  const TYPE_LABEL = { income:'수입', expense:'지출', savings:'저축', transfer:'이체' };
  const SEED_ACCOUNTS = ['토스뱅크','국민은행 체크카드통장','신한은행 통장','국민은행 적금'];
  const UNASSIGNED_NAME = '미분류';
  const ENTRIES_KEY = 'budget-entries';
  const ACCOUNTS_KEY = 'budget-accounts';
  const RECURRING_KEY = 'budget-recurring';
  const SHARED_DOC_PATH = ['budgets', 'shared-budget-v2'];

  // ===== Firebase 설정 =====
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCTIdd6jdE0wqi7nEHjAauxk1gsX843at4",
    authDomain: "mywalletflow-9fb2f.firebaseapp.com",
    projectId: "mywalletflow-9fb2f",
    storageBucket: "mywalletflow-9fb2f.firebasestorage.app",
    messagingSenderId: "926589564383",
    appId: "1:926589564383:web:be045fd7915b60958d006a"
  };
  function firebaseReady(){ return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId); }
  let fbApp = null, fbAuth = null, fbDb = null;
  if(firebaseReady()){
    try{
      fbApp = firebase.initializeApp(FIREBASE_CONFIG);
      fbAuth = firebase.auth();
      fbDb = firebase.firestore();
      fbDb.enablePersistence().catch(()=>{});
    } catch(err){ console.error('Firebase 초기화 실패', err); }
  }

  /* =====================================================================
     상태
  ===================================================================== */
  let entries = [];
  let accounts = [];       // {id, name, openingBalance, isSavings}
  let recurringRules = []; // {id, name, type, category?, accountId?, fromAccountId?, toAccountId?, amount, day, startDate, active, generatedThrough}
  let view = 'home';       // home | accounts | recurring | import
  let viewYear, viewMonth;
  let currentType = 'expense';
  let selectedAccountId = 'all';
  let renamingAccountId = null;
  let newRuleType = 'expense';
  let editingRuleId = null;
  let editRuleType = 'expense';
  let importFiles = [];    // [{id, fileName, rows, headerRowIdx, accountId, colMap}]

  let syncMode = false;
  let unsubscribeSnapshot = null;
  let initialSyncDone = false;

  const today = new Date();
  const todayDate0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();

  /* =====================================================================
     기본 유틸
  ===================================================================== */
  function todayStr(){
    return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  }
  function fmtWon(n){ return '₩' + Math.round(Number(n)||0).toLocaleString('ko-KR'); }
  function fmtSigned(n){ n = Math.round(Number(n)||0); return (n < 0 ? '-' : '') + fmtWon(Math.abs(n)); }
  function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function daysInMonth(y, monthIndex){ return new Date(y, monthIndex+1, 0).getDate(); }
  function monthKeyOf(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function nextMonthKey(key){ let [y,m]=key.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; }
  function prevMonthKey(key){ let [y,m]=key.split('-').map(Number); m--; if(m<1){m=12;y--;} return `${y}-${String(m).padStart(2,'0')}`; }
  function fmtDateObj(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

  function entrySig(e){
    if(e.type === 'transfer') return `transfer|${e.date}|${e.amount}|${e.fromAccountId}|${e.toAccountId}|${e.memo||''}`;
    return `${e.type}|${e.date}|${e.amount}|${e.accountId}|${e.memo||''}`;
  }

  function getAccount(id){ return accounts.find(a => a.id === id); }
  function accountName(id){ const a = getAccount(id); return a ? a.name : UNASSIGNED_NAME; }
  function findAccountByName(name){ return accounts.find(a => a.name === name); }
  function ensureUnassigned(){
    let u = accounts.find(a => a.name === UNASSIGNED_NAME);
    if(!u){ u = { id: uid('a'), name: UNASSIGNED_NAME, openingBalance: 0, isSavings: false }; accounts.push(u); }
    return u;
  }
  function isSavingsAccount(accountId){ const a = getAccount(accountId); return !!(a && a.isSavings); }

  function sumByType(list, type){ return list.filter(e=>e.type===type).reduce((s,e)=>s+e.amount,0); }
  function netOf(list){ return sumByType(list,'income') - sumByType(list,'expense') - sumByType(list,'savings'); }

  function accountBalance(acc){
    let bal = Number(acc.openingBalance) || 0;
    entries.forEach(e => {
      if(e.type === 'transfer'){
        if(e.fromAccountId === acc.id) bal -= e.amount;
        if(e.toAccountId === acc.id) bal += e.amount;
      } else if(e.accountId === acc.id){
        if(e.type === 'income') bal += e.amount;
        else bal -= e.amount; // expense, savings
      }
    });
    return bal;
  }
  function totalOpeningBalance(){ return accounts.reduce((s,a)=>s+(Number(a.openingBalance)||0),0); }
  function totalSavingsAccountBalance(){ return accounts.filter(a=>a.isSavings).reduce((s,a)=>s+accountBalance(a),0); }
  function savingsInflow(list){
    const oldStyle = sumByType(list,'savings');
    const viaTransfer = list.filter(e=>e.type==='transfer' && isSavingsAccount(e.toAccountId)).reduce((s,e)=>s+e.amount,0);
    return oldStyle + viaTransfer;
  }
  function entriesForMonth(y,m){
    return entries.filter(e => { const d = new Date(e.date+'T00:00:00'); return d.getFullYear()===y && d.getMonth()===m; });
  }

  /* =====================================================================
     저장소: localStorage(동기화 꺼짐) / Firestore(동기화 켜짐, 로그인 없이 기기 전체 공유)
  ===================================================================== */
  async function loadAllLocal(){
    try{ accounts = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]'); } catch(e){ accounts = []; }
    try{ entries = JSON.parse(localStorage.getItem(ENTRIES_KEY) || '[]'); } catch(e){ entries = []; }
    try{ recurringRules = JSON.parse(localStorage.getItem(RECURRING_KEY) || '[]'); } catch(e){ recurringRules = []; }
    await repairAndMigrate();
    await applyRecurringAll();
  }

  async function persistAll(){
    if(syncMode && !initialSyncDone){
      console.warn('초기 동기화 전이라 저장을 건너뜁니다.');
      return;
    }
    if(syncMode && fbDb){
      try{
        await fbDb.collection(SHARED_DOC_PATH[0]).doc(SHARED_DOC_PATH[1]).set({
          accounts: JSON.stringify(accounts),
          entries: JSON.stringify(entries),
          recurringRules: JSON.stringify(recurringRules),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      } catch(err){ console.error('동기화 저장 실패', err); }
    } else {
      try{
        localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
        localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries));
        localStorage.setItem(RECURRING_KEY, JSON.stringify(recurringRules));
      } catch(err){ console.error('저장 실패', err); }
    }
  }
  async function saveEntries(){ await persistAll(); }
  async function saveAccounts(){ await persistAll(); }
  async function saveRecurring(){ await persistAll(); }

  async function subscribeFirestore(){
    const docRef = fbDb.collection(SHARED_DOC_PATH[0]).doc(SHARED_DOC_PATH[1]);
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    unsubscribeSnapshot = docRef.onSnapshot(async (snap) => {
      const data = snap.data();
      accounts = (data && data.accounts) ? JSON.parse(data.accounts) : [];
      entries = (data && data.entries) ? JSON.parse(data.entries) : [];
      recurringRules = (data && data.recurringRules) ? JSON.parse(data.recurringRules) : [];
      await repairAndMigrate();
      initialSyncDone = true;
      await applyRecurringAll();
      renderCurrentView();
    }, (err) => {
      console.error('동기화 오류', err);
      syncMode = false;
      loadAllLocal().then(renderCurrentView);
    });
  }

  // 계좌가 없는데 예전 데이터가 있으면 승격, 계좌가 아예 없으면 기본 계좌 세팅,
  // 그리고 "존재하지 않는 계좌"를 가리키는 내역은 전부 '미분류'로 복구 (동기화 꼬임 방지)
  async function repairAndMigrate(){
    let changed = false;

    if(accounts.length === 0 && entries.length > 0){
      entries.forEach(e => {
        if(!e.accountId && e.account){
          let acc = findAccountByName(e.account);
          if(!acc){ acc = { id: uid('a'), name: e.account, openingBalance:0, isSavings:false }; accounts.push(acc); }
          e.accountId = acc.id; delete e.account; changed = true;
        }
      });
    }
    if(accounts.length === 0){
      accounts = SEED_ACCOUNTS.map(name => ({ id: uid('a'), name, openingBalance: 0, isSavings: false }));
      changed = true;
    }
    accounts.forEach(a => {
      if(typeof a.openingBalance !== 'number'){ a.openingBalance = Number(a.openingBalance)||0; changed = true; }
      if(typeof a.isSavings !== 'boolean'){ a.isSavings = !!a.isSavings; changed = true; }
    });

    entries.forEach(e => {
      if(!e.accountId && e.type !== 'transfer'){
        if(e.account){
          let acc = findAccountByName(e.account);
          if(!acc){ acc = { id: uid('a'), name: e.account, openingBalance:0, isSavings:false }; accounts.push(acc); }
          e.accountId = acc.id; delete e.account;
        } else {
          e.accountId = ensureUnassigned().id;
        }
        changed = true;
      }
    });

    const validIds = new Set(accounts.map(a=>a.id));
    entries.forEach(e => {
      if(e.type === 'transfer'){
        if(e.fromAccountId && !validIds.has(e.fromAccountId)){ e.fromAccountId = ensureUnassigned().id; validIds.add(e.fromAccountId); changed = true; }
        if(e.toAccountId && !validIds.has(e.toAccountId)){ e.toAccountId = ensureUnassigned().id; validIds.add(e.toAccountId); changed = true; }
      } else if(e.accountId && !validIds.has(e.accountId)){
        e.accountId = ensureUnassigned().id; validIds.add(e.accountId); changed = true;
      }
    });

    if(changed){ await saveAccounts(); await saveEntries(); }
  }

  /* =====================================================================
     고정비(반복 거래) 엔진
  ===================================================================== */
  async function applyRecurringAll(){
    let changed = false;
    recurringRules.forEach(rule => {
      if(!rule.active) return;
      if(rule.type === 'transfer'){
        if(!getAccount(rule.fromAccountId) || !getAccount(rule.toAccountId)) return;
      } else if(!getAccount(rule.accountId)){
        rule.accountId = ensureUnassigned().id; changed = true;
      }

      let cursorKey = rule.generatedThrough ? nextMonthKey(rule.generatedThrough) : monthKeyOf(rule.startDate);
      const startDateObj = new Date(rule.startDate + 'T00:00:00');
      let safety = 0;
      while(safety < 1200){
        safety++;
        const [y,m] = cursorKey.split('-').map(Number);
        const monthIndex = m-1;
        const dim = daysInMonth(y, monthIndex);
        const day = Math.min(rule.day, dim);
        const occDate = new Date(y, monthIndex, day);
        if(occDate > todayDate0) break;
        if(occDate >= startDateObj){
          if(rule.type === 'transfer'){
            entries.push({ id: uid('e'), date: fmtDateObj(occDate), type:'transfer', fromAccountId: rule.fromAccountId, toAccountId: rule.toAccountId, amount: rule.amount, memo: rule.name, auto:true, recurringId: rule.id });
          } else {
            entries.push({ id: uid('e'), date: fmtDateObj(occDate), type: rule.type, accountId: rule.accountId, category: rule.category, amount: rule.amount, memo: rule.name, auto:true, recurringId: rule.id });
          }
          changed = true;
        }
        rule.generatedThrough = cursorKey;
        cursorKey = nextMonthKey(cursorKey);
      }
    });
    if(changed){ await saveEntries(); await saveRecurring(); }
  }
  function nextOccurrence(rule){
    let cursorKey = rule.generatedThrough ? nextMonthKey(rule.generatedThrough) : monthKeyOf(rule.startDate);
    const [y,m] = cursorKey.split('-').map(Number);
    const monthIndex = m-1;
    const dim = daysInMonth(y, monthIndex);
    const day = Math.min(rule.day, dim);
    return new Date(y, monthIndex, day);
  }
  function ruleBadgeClass(rule){ if(rule.type==='transfer') return isSavingsAccount(rule.toAccountId)?'savings':'transfer'; return rule.type; }
  function ruleBadgeLabel(rule){ if(rule.type==='transfer') return isSavingsAccount(rule.toAccountId)?'저축':'이체'; return TYPE_LABEL[rule.type]; }
  function ruleInfoLine(rule){
    const next = rule.active ? nextOccurrence(rule) : null;
    const nextStr = next ? ` · 다음 ${next.getMonth()+1}/${next.getDate()}` : '';
    if(rule.type==='transfer') return `${escapeHtml(accountName(rule.fromAccountId))} → ${escapeHtml(accountName(rule.toAccountId))} · 매월 ${rule.day}일 · ${fmtWon(rule.amount)}${nextStr}`;
    const sign = rule.type==='income'?'+':(rule.type==='expense'?'-':'');
    return `${rule.category} · 매월 ${rule.day}일 · ${escapeHtml(accountName(rule.accountId))} · ${sign}${fmtWon(rule.amount)}${nextStr}`;
  }

  /* =====================================================================
     홈 화면
  ===================================================================== */
  function renderCurrentView(){
    if(view==='accounts') renderAccounts();
    else if(view==='recurring') renderRecurring();
    else if(view==='import') renderImport();
    else renderHome();
  }

  function renderHome(){
    let monthEntries = entriesForMonth(viewYear, viewMonth);
    if(selectedAccountId !== 'all'){
      monthEntries = monthEntries.filter(e => e.type==='transfer'
        ? (e.fromAccountId===selectedAccountId || e.toAccountId===selectedAccountId)
        : e.accountId===selectedAccountId);
    }
    monthEntries = monthEntries.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

    const mIncome = sumByType(monthEntries,'income');
    const mExpense = sumByType(monthEntries,'expense');
    const mSavings = savingsInflow(monthEntries);
    const mBalance = mIncome - mExpense - mSavings;

    const allIncome = sumByType(entries,'income');
    const allExpense = sumByType(entries,'expense');
    const allSavingsFlow = sumByType(entries,'savings');
    const allSavingsDisplay = totalSavingsAccountBalance();
    const allBalance = totalOpeningBalance() + allIncome - allExpense - allSavingsFlow;

    const accountRows = accounts.map(acc=>({acc, net:accountBalance(acc)})).sort((a,b)=>b.net-a.net)
      .map(({acc,net})=>`<div class="acc-row"><span class="acc-name">${escapeHtml(acc.name)}</span><span class="acc-val ${net<0?'neg':''}">${fmtSigned(net)}</span></div>`).join('');

    const soon = new Date(todayDate0); soon.setDate(soon.getDate()+30);
    const upcoming = recurringRules.filter(r=>r.active).map(r=>({r,occ:nextOccurrence(r)}))
      .filter(({occ})=>occ>=todayDate0 && occ<=soon).sort((a,b)=>a.occ-b.occ).slice(0,5)
      .map(({r,occ})=>`<div class="upcoming-row"><span class="u-left"><span class="u-date">${occ.getMonth()+1}/${occ.getDate()}</span>${escapeHtml(r.name)}</span><span class="u-amt">${r.type==='expense'?'-':''}${fmtWon(r.amount)}</span></div>`).join('');

    const accTabsList = [{id:'all',name:'전체'}, ...accounts];
    const accTabs = accTabsList.map(a=>`<button class="acc-tab ${selectedAccountId===a.id?'active':''}" data-acc="${a.id}">${escapeHtml(a.name)}</button>`).join('');
    const catOptions = (CATS[currentType]||[]).map(c=>`<option value="${c}">${c}</option>`).join('');
    const accOptions = accounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');

    const rows = monthEntries.map(e=>{
      if(e.type==='transfer'){
        const toSavings = isSavingsAccount(e.toAccountId);
        const cls = toSavings?'savings':'transfer'; const label = toSavings?'저축':'이체';
        return `<tr data-id="${e.id}">
          <td class="date-cell">${e.date.slice(5).replace('-','.')}</td>
          <td><span class="badge ${cls}">${label}</span></td>
          <td>${escapeHtml(accountName(e.fromAccountId))} → ${escapeHtml(accountName(e.toAccountId))}${e.auto?'<span class="auto-tag">고정</span>':''}</td>
          <td class="memo-cell" title="${escapeHtml(e.memo||'')}">${escapeHtml(e.memo||'')||'-'}</td>
          <td class="amt ${cls}">${fmtWon(e.amount)}</td>

  function attachHomeEvents(){
    document.getElementById('prevMonth').onclick = ()=>{ viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderHome(); };
    document.getElementById('nextMonth').onclick = ()=>{ viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderHome(); };
    document.getElementById('manageAccBtn').onclick = ()=>{ view='accounts'; renderAccounts(); };
    document.getElementById('manageRecBtn').onclick = ()=>{ view='recurring'; renderRecurring(); };
    document.getElementById('importBtn').onclick = ()=>{ view='import'; importFiles=[]; renderImport(); };
    const toRec = document.getElementById('toRecLink'); if(toRec) toRec.onclick=()=>{view='recurring';renderRecurring();};
    const toAcc = document.getElementById('toAccountsLink'); if(toAcc) toAcc.onclick=()=>{view='accounts';renderAccounts();};
    const goAddAcc = document.getElementById('goAddAcc'); if(goAddAcc) goAddAcc.onclick=()=>{view='accounts';renderAccounts();};

    document.querySelectorAll('input[name="type"]').forEach(r=>r.addEventListener('change',e=>{currentType=e.target.value;renderHome();}));
    document.querySelectorAll('.acc-tab').forEach(btn=>btn.addEventListener('click',e=>{selectedAccountId=e.currentTarget.getAttribute('data-acc');renderHome();}));

    const addBtn = document.getElementById('addBtn'); if(addBtn) addBtn.onclick = handleAdd;

    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const id = e.currentTarget.getAttribute('data-del');
        if(confirm('이 내역을 삭제할까요?')){ entries = entries.filter(x=>x.id!==id); saveEntries(); renderHome(); }
      });
    });
    const resetBtn = document.getElementById('resetBtn');
    if(resetBtn){
      resetBtn.onclick = async ()=>{
        if(confirm('저장된 모든 거래 내역을 삭제할까요?\n계좌 목록과 고정비 설정은 그대로 남고, 이번 달부터 새로 기록하게 됩니다.\n이 작업은 되돌릴 수 없어요.')){
          entries = [];
          selectedAccountId = 'all';
          const curKey = monthKeyOf(todayStr());
          recurringRules.forEach(r=>{ r.generatedThrough = prevMonthKey(curKey); });
          await saveEntries(); await saveRecurring(); await applyRecurringAll();
          renderHome();
        }
      };
    }
  }

  async function handleAdd(){
    const dateEl = document.getElementById('f-date');
    const amtEl = document.getElementById('f-amt');
    const memoEl = document.getElementById('f-memo');
    const msgEl = document.getElementById('formMsg');
    const date = dateEl.value;
    const amount = parseFloat(amtEl.value);
    const memo = memoEl.value.trim();
    if(!date){ msgEl.textContent='날짜를 입력해주세요.'; return; }
    if(!amount || amount<=0){ msgEl.textContent='금액을 0보다 크게 입력해주세요.'; return; }

    if(currentType==='transfer'){
      const fromEl = document.getElementById('f-from-acc'), toEl = document.getElementById('f-to-acc');
      const fromAccountId = fromEl?fromEl.value:null, toAccountId = toEl?toEl.value:null;
      if(!fromAccountId||!toAccountId){ msgEl.textContent='계좌를 선택해주세요.'; return; }
      if(fromAccountId===toAccountId){ msgEl.textContent='보내는 계좌와 받는 계좌가 같아요.'; return; }
      msgEl.textContent='';
      entries.push({ id:uid('e'), date, type:'transfer', fromAccountId, toAccountId, amount:Math.round(amount), memo });
    } else {
      const accEl = document.getElementById('f-acc'), catEl = document.getElementById('f-cat');
      const accountId = accEl?accEl.value:null;
      if(!accountId){ msgEl.textContent='계좌를 먼저 추가해주세요.'; return; }
      msgEl.textContent='';
      entries.push({ id:uid('e'), date, type:currentType, accountId, category:catEl.value, amount:Math.round(amount), memo });
    }
    await saveEntries();
    const d = new Date(date+'T00:00:00'); viewYear=d.getFullYear(); viewMonth=d.getMonth();
    renderHome();
  }

  /* =====================================================================
     계좌 관리
  ===================================================================== */
  function renderAccounts(){
    const rows = accounts.map(acc=>{
      const bal = accountBalance(acc);
      const count = entries.filter(e=>e.accountId===acc.id||e.fromAccountId===acc.id||e.toAccountId===acc.id).length;
      const opening = Number(acc.openingBalance)||0;
      if(renamingAccountId===acc.id){
        return `<div class="edit-card">
          <div class="field-row"><div class="field full"><label>계좌명</label><input type="text" id="renameInput" value="${escapeHtml(acc.name)}" maxlength="30" /></div></div>
          <div class="field-row"><div class="field full"><label>시작 잔액 (오늘 기준 현재 잔액)</label><input type="number" id="renameBalance" value="${opening}" step="1" /></div></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0 12px;cursor:pointer;">
            <input type="checkbox" id="renameIsSavings" ${acc.isSavings?'checked':''} /> 💰 저축/적금 계좌예요
          </label>
          <div class="edit-actions"><button class="save-btn" data-save="${acc.id}">저장</button><button class="cancel-btn" data-cancel="1">취소</button></div>
        </div>`;
      }
      return `<div class="mgmt-row">
        <div class="mgmt-info">
          <div class="nm">${escapeHtml(acc.name)}${acc.isSavings?'<span class="paused-tag" style="color:var(--savings);background:var(--savings-bg);">💰 저축계좌</span>':''}</div>
          <div class="bal ${bal<0?'neg':''}">현재 ${fmtSigned(bal)} · 내역 ${count}건${opening?` · 시작 잔액 ${fmtSigned(opening)}`:''}</div>
        </div>
        <div class="mgmt-actions"><button class="icon-btn" data-rename="${acc.id}">✎</button><button class="icon-btn danger" data-delete="${acc.id}">🗑</button></div>
      </div>`;
    }).join('');

    app.innerHTML = `
      <div class="header-row"><div><h1>계좌 관리</h1><p>은행·통장·카드별로 나눠서 관리해보세요</p></div><button class="ghost-btn" id="backBtn">← 돌아가기</button></div>
      <div class="mgmt-add-card">
        <h2>새 계좌 추가</h2>
        <div class="field-row"><div class="field full"><label>계좌명</label><input type="text" id="newAccName" placeholder="예: 카카오뱅크 모임통장" maxlength="30" /></div></div>
        <div class="field-row"><div class="field full"><label>시작 잔액 (선택, 지금 실제 금액)</label><input type="number" id="newAccBalance" placeholder="예: 1500000" step="1" /></div></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0 12px;cursor:pointer;">
          <input type="checkbox" id="newAccIsSavings" /> 💰 저축/적금 계좌예요
        </label>
        <button class="add-btn" id="addAccBtn">+ 계좌 추가하기</button>
      </div>
      <div class="mgmt-list-card">
        <h2>내 계좌 (${accounts.length})</h2>
        ${rows || `<div class="empty-state"><div class="big">등록된 계좌가 없어요</div><div class="small">위에서 첫 계좌를 추가해보세요.</div></div>`}
      </div>
      <div class="mgmt-add-card" style="margin-top:18px;">
        <h2>데이터 백업</h2>
        <p style="font-size:12px;color:var(--ink-soft);margin:0 0 12px;">이 기기/계정에 저장돼요. 다른 환경으로 옮기려면 내보내고 가져오세요.</p>
        <div class="edit-actions" style="margin-top:0;">
          <button class="save-btn" id="exportBtn" type="button">⬇ 내보내기</button>
          <button class="cancel-btn" id="importDataBtn" type="button">⬆ 가져오기(복원)</button>
        </div>
        <input type="file" id="importDataFile" accept="application/json" style="display:none;" />
      </div>
    `;
    attachAccountsEvents();
  }

  function attachAccountsEvents(){
    document.getElementById('backBtn').onclick = ()=>{ view='home'; renamingAccountId=null; renderHome(); };
    document.getElementById('addAccBtn').onclick = async ()=>{
      const name = document.getElementById('newAccName').value.trim();
      if(!name) return;
      if(accounts.some(a=>a.name===name)){ alert('이미 같은 이름의 계좌가 있어요.'); return; }
      const bal = document.getElementById('newAccBalance').value;
      const isSavings = document.getElementById('newAccIsSavings').checked;
      accounts.push({ id:uid('a'), name, openingBalance: bal?Math.round(parseFloat(bal)):0, isSavings });
      await saveAccounts(); renderAccounts();
    };
    document.getElementById('newAccName').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('addAccBtn').click(); });

    document.querySelectorAll('[data-rename]').forEach(btn=>btn.addEventListener('click', e=>{
      renamingAccountId = e.currentTarget.getAttribute('data-rename'); renderAccounts();
    }));
    document.querySelectorAll('[data-save]').forEach(btn=>btn.addEventListener('click', async e=>{
      const id = e.currentTarget.getAttribute('data-save');
      const newName = document.getElementById('renameInput').value.trim();
      if(!newName) return;
      if(accounts.some(a=>a.id!==id && a.name===newName)){ alert('이미 같은 이름의 계좌가 있어요.'); return; }
      const acc = getAccount(id);
      if(acc){
        acc.name = newName;
        const bal = document.getElementById('renameBalance').value;
        acc.openingBalance = bal?Math.round(parseFloat(bal)):0;
        acc.isSavings = document.getElementById('renameIsSavings').checked;
      }
      renamingAccountId = null; await saveAccounts(); renderAccounts();
    }));
    document.querySelectorAll('[data-cancel]').forEach(btn=>btn.addEventListener('click', ()=>{ renamingAccountId=null; renderAccounts(); }));
    document.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click', async e=>{
      const id = e.currentTarget.getAttribute('data-delete');
      const acc = getAccount(id); if(!acc) return;
      const linked = entries.filter(en=>en.accountId===id||en.fromAccountId===id||en.toAccountId===id).length;
      const msg = linked>0 ? `'${acc.name}' 계좌를 삭제할까요?\n연결된 내역 ${linked}건은 '미분류' 계좌로 옮겨집니다.` : `'${acc.name}' 계좌를 삭제할까요?`;
      if(!confirm(msg)) return;
      if(linked>0){
        const un = ensureUnassigned();
        entries.forEach(en=>{
          if(en.accountId===id) en.accountId = un.id;
          if(en.fromAccountId===id) en.fromAccountId = un.id;
          if(en.toAccountId===id) en.toAccountId = un.id;
        });
        await saveEntries();
      }
      accounts = accounts.filter(a=>a.id!==id);
      if(selectedAccountId===id) selectedAccountId='all';
      await saveAccounts(); renderAccounts();
    }));

    document.getElementById('exportBtn').onclick = exportData;
    document.getElementById('importDataBtn').onclick = ()=>document.getElementById('importDataFile').click();
    document.getElementById('importDataFile').addEventListener('change', e=>{
      const file = e.target.files[0]; if(file) importBackupFile(file); e.target.value='';
    });
  }

  function exportData(){
    const payload = { exportedAt:new Date().toISOString(), app:'my-budget-tracker-v2', version:2, accounts, entries, recurringRules };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`가계부-백업-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  function importBackupFile(file){
    const reader = new FileReader();
    reader.onload = async e=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!data || !Array.isArray(data.accounts) || !Array.isArray(data.entries)){ alert('올바른 백업 파일이 아니에요.'); return; }
        if(!confirm('현재 데이터를 백업 파일 내용으로 덮어쓸까요? 되돌릴 수 없어요.')) return;
        accounts = data.accounts||[]; entries = data.entries||[]; recurringRules = data.recurringRules||[];
        await saveAccounts(); await saveEntries(); await saveRecurring(); await applyRecurringAll();
        renderAccounts(); alert('데이터를 불러왔어요.');
      } catch(err){ alert('파일을 읽는 데 실패했어요.'); }
    };
    reader.readAsText(file);
  }

            <div class="field-row">
              <div class="field"><label>보내는 계좌</label><select id="edit-from-acc">${accounts.map(a=>`<option value="${a.id}" ${a.id===rule.fromAccountId?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select></div>
              <div class="field"><label>받는 계좌</label><select id="edit-to-acc">${accounts.map(a=>`<option value="${a.id}" ${a.id===rule.toAccountId?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select></div>

              <div class="field"><label>카테고리</label><select id="edit-cat">${editCat}</select></div>

  function attachRecurringEvents(){
    document.getElementById('backBtn').onclick = ()=>{ view='home'; editingRuleId=null; renderHome(); };
    document.querySelectorAll('input[name="rec-type-new"]').forEach(r=>r.addEventListener('change', e=>{ newRuleType=e.target.value; renderRecurring(); }));
    document.querySelectorAll('input[name="rec-type-edit"]').forEach(r=>r.addEventListener('change', e=>{ editRuleType=e.target.value; renderRecurring(); }));

    const addRuleBtn = document.getElementById('addRuleBtn');
    if(addRuleBtn){
      addRuleBtn.onclick = async ()=>{
        const name = document.getElementById('new-name').value.trim();
        const amount = parseFloat(document.getElementById('new-amt').value);
        const day = parseInt(document.getElementById('new-day').value,10);
        const startDate = document.getElementById('new-start').value;
        const msgEl = document.getElementById('ruleMsg');
        if(!name){ msgEl.textContent='이름을 입력해주세요.'; return; }
        if(!amount||amount<=0){ msgEl.textContent='금액을 0보다 크게 입력해주세요.'; return; }
        if(!day||day<1||day>31){ msgEl.textContent='매월 며칠인지 1~31 사이로 입력해주세요.'; return; }
        if(!startDate){ msgEl.textContent='시작일을 입력해주세요.'; return; }

        if(newRuleType==='transfer'){
          const fromAccountId = document.getElementById('new-from-acc').value;
          const toAccountId = document.getElementById('new-to-acc').value;
          if(!fromAccountId||!toAccountId){ msgEl.textContent='계좌를 선택해주세요.'; return; }
          if(fromAccountId===toAccountId){ msgEl.textContent='보내는 계좌와 받는 계좌가 같아요.'; return; }
          msgEl.textContent='';
          recurringRules.push({ id:uid('r'), name, type:'transfer', fromAccountId, toAccountId, amount:Math.round(amount), day, startDate, active:true, generatedThrough:null });
        } else {
          const accountId = document.getElementById('new-acc').value;
          if(!accountId){ msgEl.textContent='계좌를 선택해주세요.'; return; }
          msgEl.textContent='';
          recurringRules.push({ id:uid('r'), name, type:newRuleType, category:document.getElementById('new-cat').value, accountId, amount:Math.round(amount), day, startDate, active:true, generatedThrough:null });
        }
        await saveRecurring(); await applyRecurringAll(); renderRecurring();
      };
    }

    document.querySelectorAll('[data-toggle-rule]').forEach(btn=>btn.addEventListener('click', async e=>{
      const rule = recurringRules.find(r=>r.id===e.currentTarget.getAttribute('data-toggle-rule')); if(!rule) return;
      rule.active = !rule.active; await saveRecurring(); if(rule.active) await applyRecurringAll(); renderRecurring();
    }));
    document.querySelectorAll('[data-edit-rule]').forEach(btn=>btn.addEventListener('click', e=>{
      const rule = recurringRules.find(r=>r.id===e.currentTarget.getAttribute('data-edit-rule')); if(!rule) return;
      editingRuleId = rule.id; editRuleType = rule.type; renderRecurring();
    }));
    document.querySelectorAll('[data-cancel-rule]').forEach(btn=>btn.addEventListener('click', ()=>{ editingRuleId=null; renderRecurring(); }));
    document.querySelectorAll('[data-save-rule]').forEach(btn=>btn.addEventListener('click', async e=>{
      const rule = recurringRules.find(r=>r.id===e.currentTarget.getAttribute('data-save-rule')); if(!rule) return;
      const name = document.getElementById('edit-name').value.trim();
      const amount = parseFloat(document.getElementById('edit-amt').value);
      const day = parseInt(document.getElementById('edit-day').value,10);
      const startDate = document.getElementById('edit-start').value;
      if(!name||!amount||amount<=0||!day||day<1||day>31||!startDate){ alert('입력값을 다시 확인해주세요.'); return; }
      if(editRuleType==='transfer'){
        const fromAccountId = document.getElementById('edit-from-acc').value, toAccountId = document.getElementById('edit-to-acc').value;
        if(!fromAccountId||!toAccountId||fromAccountId===toAccountId){ alert('보내는 계좌와 받는 계좌를 다르게 선택해주세요.'); return; }
        rule.name=name; rule.type='transfer'; rule.fromAccountId=fromAccountId; rule.toAccountId=toAccountId;
        delete rule.accountId; delete rule.category;
        rule.amount=Math.round(amount); rule.day=day; rule.startDate=startDate;
      } else {
        const accountId = document.getElementById('edit-acc').value;
        if(!accountId){ alert('계좌를 선택해주세요.'); return; }
        rule.name=name; rule.type=editRuleType; rule.accountId=accountId; rule.category=document.getElementById('edit-cat').value;
        rule.amount=Math.round(amount); rule.day=day; rule.startDate=startDate;
        delete rule.fromAccountId; delete rule.toAccountId;
      }
      editingRuleId=null; await saveRecurring(); await applyRecurringAll(); renderRecurring();
    }));
    document.querySelectorAll('[data-del-rule]').forEach(btn=>btn.addEventListener('click', async e=>{
      const rule = recurringRules.find(r=>r.id===e.currentTarget.getAttribute('data-del-rule')); if(!rule) return;
      if(!confirm(`'${rule.name}' 고정비를 삭제할까요?\n이미 기록된 내역은 그대로 남아있어요.`)) return;
      recurringRules = recurringRules.filter(r=>r.id!==rule.id); await saveRecurring(); renderRecurring();
    }));
  }

  /* =====================================================================
     가져오기 (엑셀/CSV만 지원 — 매번 새로 확인하는 단순하고 확실한 방식)
  ===================================================================== */
  function parseAmountCell(v){
    if(v===null||v===undefined) return 0;
    const s = String(v).replace(/[,₩\s]/g,'').trim();
    if(!s) return 0;
    const n = parseFloat(s);
    return isNaN(n)?0:n;
  }
  function normalizeImportDate(v){
    const s = String(v==null?'':v).trim();
    if(!s) return null;
    const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    const d = new Date(s);
    if(!isNaN(d.getTime())) return fmtDateObj(d);
    return null;
  }
  function guessHeaderRow(rows){
    let bestIdx=0, bestScore=-1;
    for(let i=0;i<Math.min(rows.length,15);i++){
      const row = rows[i]||[]; let score=0;
      row.forEach(cell=>{ const s=String(cell==null?'':cell).trim(); if(s && !/^-?[\d,]+(\.\d+)?$/.test(s)) score++; });
      if(row.length>=2 && score>bestScore){ bestScore=score; bestIdx=i; }
    }
    return bestIdx;
  }
  function guessColumnMapping(headerRow){
    const map = { date:-1, amountMode:'single', amountIn:-1, amountOut:-1, amount:-1, memo:-1, balance:-1, institution:-1 };
    headerRow.forEach((cell,idx)=>{
      const s = String(cell==null?'':cell);
      if(map.date===-1 && /(일시|날짜|거래일)/.test(s)) map.date=idx;
      if(/^입금/.test(s) || /입금액/.test(s)) map.amountIn=idx;
      if(/^출금/.test(s) || /출금액/.test(s)) map.amountOut=idx;
      if(map.amount===-1 && /(거래금액|금액)/.test(s) && !/입금|출금/.test(s)) map.amount=idx;
      if(map.memo===-1 && /(적요|메모|내용|상대|설명|가맹점)/.test(s)) map.memo=idx;
      if(map.balance===-1 && /잔액/.test(s)) map.balance=idx;
      if(map.institution===-1 && /(거래\s*기관|송금\s*기관|상대\s*은행|기관명)/.test(s)) map.institution=idx;
    });
    map.amountMode = (map.amountIn>=0||map.amountOut>=0) ? 'split' : 'single';
    return map;
  }
  function colOptionsHtml(headerRow, selected){
    return headerRow.map((c,idx)=>`<option value="${idx}" ${idx===selected?'selected':''}>${idx+1}. ${escapeHtml(String(c==null||c===''?'(빈칸)':c))}</option>`).join('')
      + `<option value="-1" ${selected===-1?'selected':''}>(사용 안 함)</option>`;
  }

  function parseHtmlTableToRows(htmlText){
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    const table = doc.querySelector('table');
    if(!table) return [];
    const rows = [];
    table.querySelectorAll('tr').forEach(tr=>{
      const cells = Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.replace(/\s+/g,' ').trim());
      if(cells.some(c=>c!=='')) rows.push(cells);
    });
    return rows;
  }
  function isEncryptedOfficeFile(buf){
    const bytes = new Uint8Array(buf.slice(0,8));
    const sig = [0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1];
    return sig.every((b,i)=>bytes[i]===b);
  }
  async function maybeDecryptXlsx(buf, password){
    if(!password || typeof XlsxPopulate==='undefined') return buf;
    try{
      const wb = await XlsxPopulate.fromDataAsync(buf, { password });
      const blob = await wb.outputAsync();
      return await blob.arrayBuffer();
    } catch(err){ console.warn('비밀번호로 해제 실패', err); return buf; }
  }
  async function parseSpreadsheetFile(buf){
    let text = '';
    try{ text = new TextDecoder('utf-8').decode(buf); } catch(e){}
    if(/<table/i.test(text) || /<html/i.test(text)){
      const rows = parseHtmlTableToRows(text);
      if(rows.length>0) return rows;
    }
    try{
      const wb = XLSX.read(new Uint8Array(buf), { type:'array', cellDates:true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:'' });
      if(rows.length>0) return rows;
    } catch(e){}
    try{
      const wb2 = XLSX.read(text, { type:'string', cellDates:true });
      const sheet2 = wb2.Sheets[wb2.SheetNames[0]];
      const rows2 = XLSX.utils.sheet_to_json(sheet2, { header:1, raw:false, defval:'' });
      if(rows2.length>0) return rows2;
    } catch(e){}
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length>0){
      const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(',') ? ',' : null);
      if(delim) return lines.map(l=>l.split(delim));
    }
    throw new Error('지원하지 않는 파일 형식이에요.');
  }

  function matchAccountByName(text, excludeId){
    const t = String(text||'').trim().replace(/\s+/g,'');
    if(!t) return null;
    return accounts.find(a=>{
      if(a.id===excludeId) return false;
      const n = String(a.name||'').trim().replace(/\s+/g,'');
      if(!n) return false;
      return n.includes(t) || t.includes(n);
    }) || null;
  }

  function computeImportCandidates(rows, headerRowIdx, colMap, accountId, existingSig){
    const out = [];
    for(let i=headerRowIdx+1; i<rows.length; i++){
      const row = rows[i]||[];
      if(row.length===0) continue;
      const date = colMap.date>=0 ? normalizeImportDate(row[colMap.date]) : null;
      if(!date) continue;
      const sortKey = colMap.date>=0 ? String(row[colMap.date]==null?'':row[colMap.date]) : date;

      let type, amount;
      if(colMap.amountMode==='split'){
        const inAmt = colMap.amountIn>=0 ? parseAmountCell(row[colMap.amountIn]) : 0;
        const outAmt = colMap.amountOut>=0 ? parseAmountCell(row[colMap.amountOut]) : 0;
        if(inAmt>0){ type='income'; amount=inAmt; }
        else if(outAmt>0){ type='expense'; amount=outAmt; }
        else continue;
      } else {
        const v = colMap.amount>=0 ? parseAmountCell(row[colMap.amount]) : 0;
        if(!v) continue;
        type = v>=0?'income':'expense'; amount = Math.abs(v);
      }
      const memo = colMap.memo>=0 ? String(row[colMap.memo]==null?'':row[colMap.memo]).trim() : '';
      const balance = (colMap.balance>=0 && row[colMap.balance]!=='' && row[colMap.balance]!=null) ? parseAmountCell(row[colMap.balance]) : null;
      const institutionText = colMap.institution>=0 ? row[colMap.institution] : '';
      const matchedAcc = institutionText ? matchAccountByName(institutionText, accountId) : null;

      if(matchedAcc){
        const fromAccountId = type==='expense' ? accountId : matchedAcc.id;
        const toAccountId = type==='expense' ? matchedAcc.id : accountId;
        const sig = entrySig({ type:'transfer', date, amount, fromAccountId, toAccountId, memo });
        out.push({ date, type:'transfer', amount, memo, accountId, fromAccountId, toAccountId, balance, sortKey, dup: existingSig.has(sig) });
      } else {
        const category = type==='income' ? '기타수입' : '기타지출';
        const sig = entrySig({ type, date, amount, accountId, memo });
        out.push({ date, type, amount, memo, category, accountId, balance, sortKey, dup: existingSig.has(sig) });
      }
    }
    return out;
  }

      ${fileCards}
      ${importFiles.length ? `<div style="padding:4px 4px 14px;"><button class="add-btn" id="imp-preview-btn" type="button">미리보기 만들기</button></div>` : ''}
      <div id="imp-preview-area"></div>
    `;
    attachImportEvents();
  }

  function attachImportEvents(){
    document.getElementById('backBtn').onclick = ()=>{ view='home'; importFiles=[]; renderHome(); };

    const fileInput = document.getElementById('imp-file');
    if(fileInput){
      fileInput.addEventListener('change', e=>{
        const files = Array.from(e.target.files||[]);
        e.target.value = ''; // 같은 파일 재선택해도 항상 다시 처리되도록
        if(!files.length) return;
        const password = (document.getElementById('imp-file-password')||{}).value || '';
        let pending = files.length;
        files.forEach(file=>{
          const isXlsx = /\.xlsx$/i.test(file.name);
          const reader = new FileReader();
          reader.onload = async ev=>{
            try{
              let buf = ev.target.result;
              if(isXlsx && password) buf = await maybeDecryptXlsx(buf, password);
              if(isXlsx && isEncryptedOfficeFile(buf)) throw new Error('ENCRYPTED_UNRESOLVED');
              const rows = await parseSpreadsheetFile(buf);
              const headerRowIdx = guessHeaderRow(rows);
              const headerRow = rows[headerRowIdx]||[];
              importFiles.push({ id:uid('f'), fileName:file.name, rows, headerRowIdx, accountId:'', colMap:guessColumnMapping(headerRow) });
            } catch(err){
              console.error(err);
              if(err.message==='ENCRYPTED_UNRESOLVED'){
                alert(`'${file.name}' 파일은 비밀번호로 잠겨있어요.\n위쪽 "비밀번호" 칸에 암호를 입력한 뒤, 파일을 다시 선택해주세요.\n(비밀번호를 입력했는데도 이 메시지가 뜬다면, 엑셀에서 직접 암호를 풀고 CSV로 저장해서 올려주세요.)`);
              } else {
                alert(`'${file.name}' 파일을 읽는 데 실패했어요. 엑셀(.xlsx) 또는 CSV 파일이 맞는지 확인해주세요.`);
              }
            }
            pending--; if(pending===0) renderImport();
          };
          reader.readAsArrayBuffer(file);
        });
      });
    }

    document.querySelectorAll('[data-file-acc]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-acc')); if(f) f.accountId = e.currentTarget.value;
    }));
    document.querySelectorAll('[data-remove-file]').forEach(btn=>btn.addEventListener('click', e=>{
      importFiles = importFiles.filter(x=>x.id!==e.currentTarget.getAttribute('data-remove-file')); renderImport();
    }));
    document.querySelectorAll('[data-file-headerrow]').forEach(inp=>inp.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-headerrow')); if(!f) return;
      const v = parseInt(e.currentTarget.value,10);
      if(v>=1 && v<=f.rows.length){ f.headerRowIdx=v-1; f.colMap=guessColumnMapping(f.rows[f.headerRowIdx]||[]); renderImport(); }
    }));
    document.querySelectorAll('[data-file-amount-mode]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-amount-mode')); if(!f) return;
      f.colMap.amountMode = e.currentTarget.value; renderImport();
    }));
    document.querySelectorAll('[data-file-col-date]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-col-date')); if(f) f.colMap.date = parseInt(e.currentTarget.value,10);
    }));
    document.querySelectorAll('[data-file-col-in]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-col-in')); if(f) f.colMap.amountIn = parseInt(e.currentTarget.value,10);
    }));
    document.querySelectorAll('[data-file-col-out]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-col-out')); if(f) f.colMap.amountOut = parseInt(e.currentTarget.value,10);
    }));
    document.querySelectorAll('[data-file-col-amount]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-col-amount')); if(f) f.colMap.amount = parseInt(e.currentTarget.value,10);
    }));
    document.querySelectorAll('[data-file-col-memo]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-col-memo')); if(f) f.colMap.memo = parseInt(e.currentTarget.value,10);
    }));
    document.querySelectorAll('[data-file-col-balance]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-col-balance')); if(f) f.colMap.balance = parseInt(e.currentTarget.value,10);
    }));
    document.querySelectorAll('[data-file-col-institution]').forEach(sel=>sel.addEventListener('change', e=>{
      const f = importFiles.find(x=>x.id===e.currentTarget.getAttribute('data-file-col-institution')); if(f) f.colMap.institution = parseInt(e.currentTarget.value,10);
    }));

    const previewBtn = document.getElementById('imp-preview-btn');
    if(previewBtn) previewBtn.onclick = renderImportPreview;
  }

  function renderImportPreview(){
    const ready = importFiles.filter(f=>f.accountId && f.colMap.date>=0);
    if(!ready.length){ alert('계좌와 날짜 열이 지정된 파일이 하나도 없어요.'); return; }

    const existingSig = new Set(entries.map(entrySig));
    let allCandidates = [];
    ready.forEach(f=>{
      const cands = computeImportCandidates(f.rows, f.headerRowIdx, f.colMap, f.accountId, existingSig);
      allCandidates = allCandidates.concat(cands.map(c=>({...c, sourceFile:f.fileName})));
    });

    // 시작 잔액: "가장 최근 거래 후 잔액"을 기준으로 역산 → 중간에 거래가 빠져도 최종 잔액이 항상 맞음
    const touchedAccountIds = Array.from(new Set(ready.map(f=>f.accountId)));
    const openingSuggestions = {};
    touchedAccountIds.forEach(accId=>{
      const alreadyHasData = entries.some(e=>e.accountId===accId||e.fromAccountId===accId||e.toAccountId===accId);
      const candsForAcc = allCandidates.filter(c=>c.accountId===accId && c.balance!=null && !isNaN(c.balance))
        .sort((a,b)=>String(a.sortKey||a.date).localeCompare(String(b.sortKey||b.date)));
      if(!candsForAcc.length) return;
      const latest = candsForAcc[candsForAcc.length-1];
      const nonDup = allCandidates.filter(c=>c.accountId===accId && !c.dup);
      const sumDeltas = nonDup.reduce((s,c)=>{
        const signed = c.type==='transfer' ? (c.toAccountId===accId?c.amount:-c.amount) : (c.type==='income'?c.amount:-c.amount);
        return s+signed;
      },0);
      openingSuggestions[accId] = { value: Math.round(latest.balance - sumDeltas), isFresh: !alreadyHasData };
    });

    const openingEntries = Object.entries(openingSuggestions);
    const openingNoteHtml = openingEntries.length ? `<div class="hint" style="margin:0 0 12px;">
      ${openingEntries.map(([accId,info])=> info.isFresh
        ? `💡 새 계좌 '${escapeHtml(accountName(accId))}'의 시작 잔액을 자동으로 ${fmtSigned(info.value)}(으)로 맞출게요.`
        : `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" data-apply-opening="${accId}" /> '${escapeHtml(accountName(accId))}'은 이미 내역이 있는 계좌예요. 가져온 내역 기준 시작 잔액은 ${fmtSigned(info.value)}이에요 — 지금 설정값으로 덮어쓸까요?</label>`
      ).join('<br/>')}
    </div>` : '';

    const area = document.getElementById('imp-preview-area');
    const newCount = allCandidates.filter(c=>!c.dup).length;
    const dupCount = allCandidates.length - newCount;

    const rowsHtml = allCandidates.slice(0,20).map(c=>{
      if(c.type==='transfer'){
        return `<tr><td class="date-cell">${c.date}</td><td><span class="badge transfer">이체</span></td>
          <td class="memo-cell">${escapeHtml(accountName(c.fromAccountId))} → ${escapeHtml(accountName(c.toAccountId))}</td>
          <td class="memo-cell">${escapeHtml(c.memo)||'-'}</td><td class="amt transfer">${fmtWon(c.amount)}</td>
          <td style="font-size:11px;color:var(--ink-soft);">${c.dup?'이미 있음':''}</td></tr>`;
      }
      return `<tr><td class="date-cell">${c.date}</td><td><span class="badge ${c.type}">${TYPE_LABEL[c.type]}</span></td>
        <td class="memo-cell">${escapeHtml(accountName(c.accountId))}</td>
        <td class="memo-cell">${escapeHtml(c.memo)||'-'}</td>
        <td class="amt ${c.type}">${c.type==='income'?'+':'-'}${fmtWon(c.amount)}</td>
        <td style="font-size:11px;color:var(--ink-soft);">${c.dup?'이미 있음':''}</td></tr>`;
    }).join('');

    area.innerHTML = `<div class="list-card">
      <div class="list-head"><h2>미리보기</h2><span class="count">총 ${allCandidates.length}건 · 새 항목 ${newCount}건${dupCount?` · 중복 추정 ${dupCount}건(제외)`:''}</span></div>
      ${allCandidates.length ? `
        <table><thead><tr><th>날짜</th><th>구분</th><th>계좌</th><th>메모</th><th class="num">금액</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table>
        ${allCandidates.length>20?`<p style="font-size:12px;color:var(--ink-soft);padding:8px 4px;">...외 ${allCandidates.length-20}건 더 (가져오기엔 전부 포함돼요)</p>`:''}
      ` : `<div class="empty-state"><div class="big">읽을 수 있는 거래가 없어요</div><div class="small">열 지정을 다시 확인해주세요.</div></div>`}
      <div style="padding:14px 4px;">
        ${openingNoteHtml}
        <button class="add-btn" id="imp-confirm-btn" ${newCount===0?'disabled':''}>이 중 새 항목 ${newCount}건 가져오기</button>
      </div>
    </div>`;

    const confirmBtn = document.getElementById('imp-confirm-btn');
    if(confirmBtn){
      confirmBtn.onclick = async ()=>{
        const toAdd = allCandidates.filter(c=>!c.dup);
        toAdd.forEach(c=>{
          if(c.type==='transfer') entries.push({ id:uid('e'), date:c.date, type:'transfer', fromAccountId:c.fromAccountId, toAccountId:c.toAccountId, amount:Math.round(c.amount), memo:c.memo });
          else entries.push({ id:uid('e'), date:c.date, type:c.type, accountId:c.accountId, category:c.category, amount:Math.round(c.amount), memo:c.memo });
        });
        const appliedOpenings = [];
        Object.entries(openingSuggestions).forEach(([accId,info])=>{
          const acc = getAccount(accId); if(!acc) return;
          const chk = document.querySelector(`[data-apply-opening="${accId}"]`);
          if(info.isFresh || (chk && chk.checked)){ acc.openingBalance = info.value; appliedOpenings.push(`${acc.name}: ${fmtSigned(info.value)}`); }
        });
        await saveEntries(); await saveAccounts();
        alert(`${toAdd.length}건을 가져왔어요.${appliedOpenings.length?'\n\n시작 잔액 설정:\n'+appliedOpenings.join('\n'):''}`);
        importFiles = []; view='home';
        if(toAdd.length){ const d=new Date(toAdd[toAdd.length-1].date+'T00:00:00'); viewYear=d.getFullYear(); viewMonth=d.getMonth(); }
        renderHome();
      };
    }
  }

  /* =====================================================================
     초기화
  ===================================================================== */
  (async function init(){
    if(firebaseReady()){
      try{
        await fbAuth.signInAnonymously();
        syncMode = true;
        const docRef = fbDb.collection(SHARED_DOC_PATH[0]).doc(SHARED_DOC_PATH[1]);
        const snap = await docRef.get();
        if(!snap.exists){
          await loadAllLocal();
          initialSyncDone = true;
          await persistAll();
        }
        await subscribeFirestore();
      } catch(err){
        console.error('동기화 연결 실패, 이 기기에만 저장합니다', err);
        syncMode = false;
        await loadAllLocal();
        renderHome();
      }
    } else {
      syncMode = false;
      await loadAllLocal();
      renderHome();
    }
  })();
})();
</script>
